name: SukiSU-Ultra Kernel Build Process

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      build_type:
        required: false
        type: string
      susfs:
        required: true
        type: string
      bbg:
        required: true
        type: string
      unicodefix:
        required: true
        type: string
      nomount:
        required: true
        type: string
      ksun:
        required: true
        type: string
      droidspace:
        required: true
        type: string
      ntsync:
        required: true
        type: string
      bbrv3:
        required: true
        type: string
      cache:
        required: true
        type: string
      ipv6_nat:
        required: true
        type: string
      optimization:
        required: true
        type: string
      ttl:
        required: true
        type: string
      lto:
        required: true
        type: string

jobs:
  build-samsung-gki:
    name: "${{ inputs.branch }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Store branch as env variable
        run: echo "BRANCH=${{ inputs.branch }}" >> $GITHUB_ENV

      - name: Get kernel version before cloning
        uses: ./.github/actions/kernel-info

      - name: Store LTO as env variable
        run: |
          if [[ $KERNEL_VER != 6.6 ]]; then
            echo "BUILD_LTO=${{ inputs.lto }}" >> $GITHUB_ENV
          else
            echo "BUILD_LTO=default" >> $GITHUB_ENV
          fi

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Setup more Swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 25

      - name: Parse branch for cache keys
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        uses: ./.github/actions/parse-branch

      - name: Install ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: sudo apt-get update && sudo apt-get install -y ccache

      - name: Export ccache + determinism
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: |
          CACHE_DIR="${{ github.workspace }}/.ccache"
          mkdir -p "$CACHE_DIR"

          SETTINGS=(
            "CCACHE_DIR=$CACHE_DIR"
            "CCACHE_MAXSIZE=12G"
            "CCACHE_COMPILERCHECK=content"
            "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            "CCACHE_NOHASHDIR=true"
            "CCACHE_IGNOREOPTIONS=-sysroot* -fdebug-prefix-map=* -fmacro-prefix-map=*"
            "CCACHE_COMPRESS=true"
            "CCACHE_COMPRESSLEVEL=8"
            "CCACHE_DIRECT=true"
            "CCACHE_FILE_CLONE=true"
            "CCACHE_INODE_CACHE=true"
            "CCACHE_IS_KERNEL_COMPILING=true"
            "CCACHE_UMASK=002"
            "KBUILD_BUILD_TIMESTAMP=2026-01-01"
            "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,file_stat_matches"
          )

          for setting in "${SETTINGS[@]}"; do
            export "$setting"
            echo "$setting" >> $GITHUB_ENV
          done

          if ccache --help 2>&1 | grep -q 'depend_mode'; then
            echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
          fi

      - name: Restore ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ inputs.build_type }}-${{ env.BASE_BRANCH }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ inputs.build_type }}-${{ env.BASE_BRANCH }}
            ccache-${{ runner.os }}-${{ inputs.build_type }}-

      - name: Ensure ccache is used
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          echo "CC='ccache clang'" >> $GITHUB_ENV
          echo "CXX='ccache clang++'" >> $GITHUB_ENV

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="${BRANCH}-${ANDROID_VER}_${KERNEL_VER}"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Dependencies
        uses: ./.github/actions/dependencies

      - name: Download Kernel
        uses: ./.github/actions/clone-kernel

      - name: Set Path Environment Variables
        uses: ./.github/actions/env-variables

      - name: Extract all tar.xz files and delete them
        run: |
          cd "$CONFIG"
          find . -type f -name '*.tar.xz' -print0 | while IFS= read -r -d '' file; do
            echo "Extracting $file"
            tar -xf "$file"
            rm "$file"
          done

      # SukiSU-Ultra integration
      - name: Add SukiSU-Ultra
        if: inputs.ksun == 'true'
        uses: ./.github/actions/sukisu-ultra
        with:
          susfs: ${{ inputs.susfs }}

      - name: Add SUSFS
        if: inputs.susfs == 'true'
        uses: ./.github/actions/susfs-patches

      - name: Add nomount
        if: inputs.nomount == 'true'
        uses: ./.github/actions/nomount

      - name: Add BBG
        if: inputs.bbg == 'true'
        uses: ./.github/actions/bbg

      - name: Add unicodefix
        if: inputs.unicodefix == 'true'
        uses: ./.github/actions/unicode

      - name: Add droidspace support
        if: inputs.droidspace == 'true'
        uses: ./.github/actions/droidspaces

      - name: Add ntsync
        if: inputs.ntsync == 'true'
        uses: ./.github/actions/ntsync

      - name: Add bbrv3
        if: inputs.bbrv3 == 'true'
        uses: ./.github/actions/bbrv3

      - name: Add IP-SET and IPv6_NAT support
        if: inputs.ipv6_nat == 'true'
        uses: ./.github/actions/IPv6_NAT

      - name: Add TTL support
        if: inputs.ttl == 'true'
        uses: ./.github/actions/TTL

      - name: Add optimization patches
        if: inputs.optimization == 'true' && !startsWith(env.BRANCH, 'SM-S711')
        uses: ./.github/actions/optimization

      - name: Set Kernel Configuration Variables
        if: inputs.ksun == 'true'
        uses: ./.github/actions/configs
        env:
          BRANCH: ${{ env.BRANCH }}
          COMMON: ${{ env.COMMON }}
          CONFIG: ${{ env.CONFIG }}
          GKI_DEFCONFIG: ${{ env.GKI_DEFCONFIG }}

      - name: Change Kernel Name and clean dirty
        uses: ./.github/actions/kernel-name

      - name: Remove protected exports
        uses: ./.github/actions/abi-export

      - name: Set file name
        uses: ./.github/actions/file-name
        with:
          ksun: ${{ inputs.ksun }}
          susfs: ${{ inputs.susfs }}
          nomount: ${{ inputs.nomount }}
          bbg: ${{ inputs.bbg }}
          bbrv3: ${{ inputs.bbrv3 }}
          droidspaces: ${{ inputs.droidspace }}
          ntsync: ${{ inputs.ntsync }}
          ipv6_nat: ${{ inputs.ipv6_nat }}
          ttl: ${{ inputs.ttl }}
          unicodefix: ${{ inputs.unicodefix }}

      - name: Change variables to ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        uses: ./.github/actions/use-ccache

      - name: Configure LTO
        uses: ./.github/actions/lto

      - name: Build
        uses: ./.github/actions/build
        with:
          build_type: ${{ inputs.build_type }}

      - name: Clean up ccache
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: ccache -c

      - name: ccache stats
        if: inputs.cache == 'true' && inputs.build_type == 'make'
        run: ccache -s -v || ccache -s

      - name: Prepare AnyKernel3
        uses: ./.github/actions/ak3zip-prep

      - name: Upload AnyKernel3 Artifacts
        id: upload_ak3
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.FILE_NAME }}-AnyKernel3
          path: |
            ./AnyKernel3/**
          compression-level: 9

      - name: Scan and collect patch rejects
        if: always()
        run: |
          set -e
          CONFIG_DIR="$CONFIG"
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$CONFIG_DIR" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "Found $REJ_COUNT .rej files under $CONFIG_DIR"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$CONFIG_DIR"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                ORIG_DEST="$REJECTS_DIR/${REL%.rej}"
                mkdir -p "$(dirname "$ORIG_DEST")"
                cp "$ORIG" "$ORIG_DEST"
              fi

              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      - name: Generate Build Summary
        if: always()
        run: |
          echo "# Kernel Build Summary" > build_summary.md
          echo "## ${{ env.FILE_NAME }}" >> build_summary.md
          echo "## Build Information" >> build_summary.md
