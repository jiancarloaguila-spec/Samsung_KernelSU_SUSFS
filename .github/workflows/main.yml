
name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Choose Release Type"
        required: true
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      lto:
        description: "Choose LTO build"
        required: true
        type: choice
        options:
          - default
          - thin
          - full
        default: default

      ksun:
        description: "SukiSU-Ultra"
        required: false
        default: true
        type: boolean

      susfs:
        description: "SUSFS"
        required: false
        type: boolean
        default: true

      nomount:
        description: "NoMount"
        required: false
        type: boolean
        default: true

      bbg:
        description: "BBG"
        required: false
        type: boolean
        default: true

      unicodefix:
        description: "Unicode fix"
        required: false
        type: boolean
        default: true

      droidspace:
        description: "Droidspaces"
        required: false
        type: boolean
        default: true

      ntsync:
        description: "NTsync"
        required: false
        type: boolean
        default: true

      bbrv3:
        description: "BBRv3"
        required: false
        type: boolean
        default: true

      cache:
        description: "CCache"
        required: false
        default: true
        type: boolean

      ipv6_nat:
        description: "IPv6_NAT & IP-SET"
        required: false
        default: true
        type: boolean

      optimization:
        description: "Optimization patches"
        required: false
        default: true
        type: boolean

      ttl:
        description: "TTL support"
        required: false
        default: true
        type: boolean

jobs:
  build-samsung:
    uses: ./.github/workflows/kernel-samsung.yml
    secrets: inherit
    with:
      susfs: ${{ inputs.susfs }}
      bbg: ${{ inputs.bbg }}
      unicodefix: ${{ inputs.unicodefix }}
      nomount: ${{ inputs.nomount }}
      ksun: ${{ inputs.ksun }}
      droidspace: ${{ inputs.droidspace }}
      ntsync: ${{ inputs.ntsync }}
      bbrv3: ${{ inputs.bbrv3 }}
      cache: ${{ inputs.cache }}
      ipv6_nat: ${{ inputs.ipv6_nat }}
      optimization: ${{ inputs.optimization }}
      ttl: ${{ inputs.ttl }}
      lto: ${{ inputs.lto }}

  release:
    runs-on: ubuntu-latest
    if: inputs.release_type != 'Actions'
    needs:
      - build-samsung

    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NAME: "Samsung GKI Kernels With SukiSU-Ultra & SUSFS"
      SUKISU_REPO: ${{ vars.SUKISU_ULTRA_REPO }}

    steps:
      - name: Free Disk Space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Generate New Tag
        run: |
          LATEST_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/tags" --jq '.[0].name' 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v2.4.0-r0"
          fi

          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')

          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-AnyKernel3'

      - name: Get commit hashes
        run: |
          echo "SUSFS_510=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android12-5.10 | cut -f1)" >> "$GITHUB_ENV"
          echo "SUSFS_515=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android13-5.15 | cut -f1)" >> "$GITHUB_ENV"
          echo "SUSFS_61=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android14-6.1 | cut -f1)" >> "$GITHUB_ENV"
          echo "SUSFS_66=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android15-6.6 | cut -f1)" >> "$GITHUB_ENV"

          if [ -n "$SUKISU_REPO" ]; then
            SUKISU_HASH=$(git ls-remote "https://github.com/${SUKISU_REPO}.git" HEAD | cut -f1)
            echo "SUKISU_HASH=$SUKISU_HASH" >> "$GITHUB_ENV"
          else
            echo "SUKISU_HASH=Not configured" >> "$GITHUB_ENV"
            echo "SukiSU-Ultra repository not configured."
          fi

          echo "BBG_HASH=$(git ls-remote https://github.com/vc-teahouse/Baseband-guard.git refs/heads/main | cut -f1)" >> "$GITHUB_ENV"
          echo "NM_HASH=$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/master | cut -f1)" >> "$GITHUB_ENV"

      - name: Set release body
        run: |
          cat << 'EOF' > release_body.md

          **IMPORTANT DISCLAIMER**

          This software is provided for testing and educational purposes only. Use at your own risk.
          The developers are not responsible for any damage, data loss, or issues that may occur.
          Please ensure you have proper backups before installation.

          Features:
          EOF

          if [ "${{ inputs.ksun }}" = "true" ]; then
            cat <<'EOF' >> release_body.md
          -> SukiSU-Ultra - Kernel-level root solution
          EOF

            if [ -n "$SUKISU_REPO" ]; then
              echo "-> Source: https://github.com/${SUKISU_REPO}" >> release_body.md
            fi
          fi

          if [ "${{ inputs.susfs }}" = "true" ]; then
            cat <<'EOF' >> release_body.md
          -> SUSFS v2.4.0
          -> SUSFS Inline hooks
          -> https://gitlab.com/simonpunk/susfs4ksu
          EOF
          fi

          if [ "${{ inputs.bbg }}" = "true" ]; then
            echo "-> BBG - https://github.com/vc-teahouse/Baseband-guard" >> release_body.md
          fi

          if [ "${{ inputs.unicodefix }}" = "true" ]; then
            echo "-> Unicode fix - Prevent path traversal and other detections using non-printable Unicode codepoints" >> release_body.md
          fi

          if [ "${{ inputs.nomount }}" = "true" ]; then
            echo "-> NoMount - https://github.com/maxsteeel/nomount" >> release_body.md
          fi

          if [ "${{ inputs.droidspace }}" = "true" ]; then
            echo "-> Droidspaces support - https://github.com/ravindu644/Droidspaces-OSS" >> release_body.md
          fi

          if [ "${{ inputs.ntsync }}" = "true" ]; then
            echo "-> NTSync - High-performance synchronization primitives compatible with the Windows NT kernel API" >> release_body.md
          fi

          if [ "${{ inputs.bbrv3 }}" = "true" ]; then
            cat <<'EOF' >> release_body.md
          -> TCP BBRV3
          -> CAKE and PIE qdisc Support
          EOF
          fi

          if [ "${{ inputs.ipv6_nat }}" = "true" ]; then
            echo "-> IP Set & IPv6 NAT Support - Advanced firewall capabilities and IPv6 NAT Support" >> release_body.md
          fi

          if [ "${{ inputs.ttl }}" = "true" ]; then
            echo "-> TTL Target Support - Network packet manipulation" >> release_body.md
          fi

          if [ "${{ inputs.optimization }}" = "true" ]; then
            cat <<'EOF' >> release_body.md
          -> Kernel Optimization - Memory, I/O, CPU scheduler, network and other general tunings
          -> https://github.com/WildKernels/kernel_patches/tree/main/common
          EOF
          fi

          echo "-> Built using LTO: ${{ inputs.lto }}" >> release_body.md

          cat <<'EOF' >> release_body.md

          Notes:
          - Currently KPM ONLY works for S24U and S25U.

          Modules:
          -> https://github.com/sidex15/ksu_module_susfs
          -> https://github.com/rrr333nnn333/BRENE

          Commit Hashes:
          EOF

          if [ "${{ inputs.ksun }}" = "true" ]; then
            echo "SukiSU-Ultra: ${{ env.SUKISU_HASH }}" >> release_body.md
          fi

          if [ "${{ inputs.susfs }}" = "true" ]; then
            cat <<EOF >> release_body.md
          SUSFS:
          android12-5.10: ${{ env.SUSFS_510 }}
          android13-5.15: ${{ env.SUSFS_515 }}
          android14-6.1: ${{ env.SUSFS_61 }}
          android15-6.6: ${{ env.SUSFS_66 }}
          EOF
          fi

          if [ "${{ inputs.bbg }}" = "true" ]; then
            echo "BBG: ${{ env.BBG_HASH }}" >> release_body.md
          fi

          if [ "${{ inputs.nomount }}" = "true" ]; then
            echo "NoMount: ${{ env.NM_HASH }}" >> release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: ${{ inputs.release_type == 'Pre-Release' }}
          files: ""
          name: ${{ env.RELEASE_NAME }}
          body_path: release_body.md

      - name: Upload Release Assets
        run: |
          shopt -s nullglob
          anykernel_dirs=(./downloaded-artifacts/*/)

          if [ ${#anykernel_dirs[@]} -eq 0 ]; then
            echo "No artifact directories found; skipping upload."
          else
            for dir in "${anykernel_dirs[@]}"; do
              if [[ "$(basename "$dir")" == *"-AnyKernel3" ]]; then
                artifact_name=$(basename "$dir")

                echo "Creating ZIP for $artifact_name..."
                cd "$dir"
                zip -r -9 "../../${artifact_name}.zip" ./*
                cd - > /dev/null

                echo "Uploading ${artifact_name}.zip..."
                gh release upload "$NEW_TAG" "${artifact_name}.zip"
              fi
            done
          fi
