name: "Setup SukiSU-Ultra"
description: "Clones and sets up SukiSU-Ultra for kernel building"

runs:
  using: "composite"
  steps:
    - name: Setup SukiSU-Ultra
      shell: bash
      run: |
        set -euo pipefail

        # Define fallback default if SUKISU_REPO is empty/not passed
        SUKISU_REPO="${SUKISU_REPO:-SukiSU-Ultra/SukiSU-Ultra}"

        echo "=============================================="
        echo "           Setting up SukiSU-Ultra            "
        echo "=============================================="

        echo "[+] Setting up KernelSU..."
        if [ -d "KernelSU" ]; then
            echo "Existing KernelSU directory found. Removing..."
            rm -rf KernelSU
        fi

        echo "Cloning SukiSU-Ultra from https://github.com/$SUKISU_REPO..."
        git clone "https://github.com/$SUKISU_REPO.git" KernelSU
        
        cd KernelSU
        git fetch --tags origin main
